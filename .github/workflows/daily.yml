name: Daily Points Report

on:
  schedule:
    - cron: '7 8 * * *'   # runs daily at 08:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Generate
        run: |
          python points.py > "report-$(date -u +'%Y%m%d').txt"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report-*.txt
          git commit -m "chore: daily points report $(date -u +'%Y-%m-%d')" || echo "no changes"
          git push
